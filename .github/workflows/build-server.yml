name: Build Minecraft Server

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Server / release name"
        required: true
        type: string
      version:
        description: "Minecraft version"
        required: true
        type: string
      world_url:
        description: "Direct download URL for the world ZIP"
        required: true
        type: string
      resource_pack_url:
        description: "Optional direct download URL for a resource-pack ZIP. If empty, search the world ZIP when automatic detection is enabled."
        required: false
        type: string
      detect_resource_pack:
        description: "Automatically search the world ZIP for a resource pack when no resource-pack URL is supplied."
        required: false
        default: true
        type: boolean
      description:
        description: "Description shown at the top of the GitHub Release"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Select exact Mojang server JAR and Java version
