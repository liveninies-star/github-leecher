            1.9.3|8|https://piston-data.mojang.com/v1/objects/8e897b6d784f745332644f4d104f7a6e737ccf/server.jar
            1.9.2|8|https://piston-data.mojang.com/v1/objects/2b95cc7b136017e064c46d04a5825fe4cfa1be30/server.jar
            1.9.1|8|https://piston-data.mojang.com/v1/objects/bf95d9118d9b4b827f524c878efd275125b56181/server.jar
            1.9|8|https://piston-data.mojang.com/v1/objects/b4d449cf2918e0f3bd8aa18954b916a4d1880f0d/server.jar
            1.8.9|8|https://launcher.mojang.com/v1/objects/b58b2ceb36e01bcd8dbf49c8fb66c55a9f0676cd/server.jar
            1.8.8|8|https://launcher.mojang.com/v1/objects/5fafba3f58c40dc51b5c3ca72a98f62dfdae1db/server.jar
            1.8.7|8|https://launcher.mojang.com/v1/objects/35c59e16d1f3b751cd20b76b9b8a19045de363a9/server.jar
            1.8.6|8|https://launcher.mojang.com/v1/objects/2bd44b53198f143fb278f8bec3a505dad0beacd2/server.jar
            1.8.5|8|https://launcher.mojang.com/v1/objects/ea6dd23658b167dbc0877015d1072cac21ab6eee/server.jar
            1.8.4|8|https://launcher.mojang.com/v1/objects/dd4b5eba1c79500390e0b0f45162fa70d38f8a3d/server.jar
            1.8.3|8|https://launcher.mojang.com/v1/objects/163ba351cb86f6390450bb2a67fafeb92b6c0f2f/server.jar
            1.8.2|8|https://launcher.mojang.com/v1/objects/a37bdd5210137354ed1bfe3dac0a5b77fe08fe2e/server.jar
            1.8.1|8|https://launcher.mojang.com/v1/objects/68bfb524888f7c0ab939025e07e5de08843dac0/server.jar
            1.8|8|https://piston-data.mojang.com/v1/objects/a028f00e678ee5c6aef0e29656dca091b5df11c/server.jar
        shell: bash
        run: |
          IFS='|' read -r SELECTED_VERSION JAVA_VERSION SERVER_JAR_URL < <(
            printf '%s\n' "$VERSION_TABLE" | awk -F'|' -v v="$MC_VERSION" '$1 == v { print; exit }'
          )
          if [ -z "${SELECTED_VERSION:-}" ]; then
            echo "::error::Unsupported Minecraft version: $MC_VERSION"
            exit 1
          fi
          echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_ENV"
          echo "SERVER_JAR_URL=$SERVER_JAR_URL" >> "$GITHUB_ENV"

      - name: Set up required Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          java-package: jdk
          check-latest: false

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip python3
          rm -rf build
          mkdir -p build/downloads build/world-extracted build/resource-pack-work build/server

      - name: Download Minecraft server JAR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            --output build/server/server.jar "$SERVER_JAR_URL"
          test -s build/server/server.jar

      - name: Download world ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --show-error \
            --location \
            --proto '=https,http' \
            --proto-redir '=https,http' \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --output build/downloads/world.zip \
            "${{ inputs.world_url }}"
          test -s build/downloads/world.zip
          unzip -tq build/downloads/world.zip >/dev/null

      - name: Locate and install actual world directory
        shell: bash
        run: |
          set -euo pipefail
          unzip -q build/downloads/world.zip -d build/world-extracted
          mapfile -t LEVEL_FILES < <(find build/world-extracted -type f -name level.dat -print)
          if [ "${#LEVEL_FILES[@]}" -eq 0 ]; then
            echo "::error::No level.dat found in the world ZIP."
            exit 1
          fi
          if [ "${#LEVEL_FILES[@]}" -ne 1 ]; then
            echo "::error::More than one level.dat was found; refusing to guess the world."
            printf '%s\n' "${LEVEL_FILES[@]}"
            exit 1
          fi
          WORLD_DIR="$(dirname "${LEVEL_FILES[0]}")"
          mkdir -p build/server/world
          cp -a "$WORLD_DIR/." build/server/world/
          test -f build/server/world/level.dat

      - name: Resolve resource pack
        env:
          EXPLICIT_RESOURCE_PACK_URL: ${{ inputs.resource_pack_url }}
          AUTO_DETECT_RESOURCE_PACK: ${{ inputs.detect_resource_pack }}
        shell: bash
        run: |
          set -euo pipefail

          normalize_pack_dir() {
            local candidate_root="$1"
            local output_zip="$2"
            mapfile -t META < <(find "$candidate_root" -type f -name pack.mcmeta -print)
            if [ "${#META[@]}" -ne 1 ]; then
              echo "::error::Resource-pack candidate must contain exactly one pack.mcmeta; found ${#META[@]}."
              return 1
            fi
            local pack_root
            pack_root="$(dirname "${META[0]}")"
            ( cd "$pack_root" && zip -qr -6 "$GITHUB_WORKSPACE/$output_zip" . )
          }

          normalize_pack_zip() {
            local archive="$1"
            local work="$2"
            local output_zip="$3"
            rm -rf "$work"
            mkdir -p "$work"
            unzip -q "$archive" -d "$work"
            normalize_pack_dir "$work" "$output_zip"
          }

          if [ -n "$EXPLICIT_RESOURCE_PACK_URL" ]; then
            echo "Explicit resource-pack URL supplied; ignore resource packs inside the world ZIP."
            curl --fail --location --retry 5 --retry-delay 2 \
              --output build/downloads/resource-pack-source.zip "$EXPLICIT_RESOURCE_PACK_URL"
            unzip -tq build/downloads/resource-pack-source.zip >/dev/null
            normalize_pack_zip \
              build/downloads/resource-pack-source.zip \
              build/resource-pack-work/explicit \
              build/server/resource-pack.zip
            echo "HAS_RESOURCE_PACK=true" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$AUTO_DETECT_RESOURCE_PACK" != "true" ]; then
            echo "Automatic resource-pack detection disabled."
            echo "No explicit resource-pack URL supplied."
            echo "HAS_RESOURCE_PACK=false" >> "$GITHUB_ENV"
            exit 0
          fi

          mapfile -t DIR_CANDIDATES < <(find build/world-extracted -type f -name pack.mcmeta -print)
          mapfile -t ZIP_CANDIDATES < <(
            while IFS= read -r candidate; do
              if unzip -Z1 "$candidate" 2>/dev/null | grep -Eq '(^|/)pack\.mcmeta$'; then
                printf '%s\n' "$candidate"
              fi
            done < <(find build/world-extracted -type f -iname '*.zip' -print)
          )

          count=$(( ${#DIR_CANDIDATES[@]} + ${#ZIP_CANDIDATES[@]} ))
          if [ "$count" -eq 0 ]; then
            echo "No resource pack found."
            echo "HAS_RESOURCE_PACK=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::Multiple resource-pack candidates found. Supply resource_pack_url explicitly to choose one."
            printf 'Directory candidates:\n%s\n' "${DIR_CANDIDATES[*]-}"
            printf 'ZIP candidates:\n%s\n' "${ZIP_CANDIDATES[*]-}"
            exit 1
          fi

          if [ "${#DIR_CANDIDATES[@]}" -eq 1 ]; then
            normalize_pack_dir \
              "$(dirname "${DIR_CANDIDATES[0]}")" \
              build/server/resource-pack.zip
          else
            normalize_pack_zip \
              "${ZIP_CANDIDATES[0]}" \
              build/resource-pack-work/from-world \
              build/server/resource-pack.zip
          fi

          echo "HAS_RESOURCE_PACK=true" >> "$GITHUB_ENV"

      - name: First Minecraft run to generate eula.txt and server.properties
        working-directory: build/server
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 180s java -Xms1G -Xmx4G -jar server.jar nogui >first-run.log 2>&1
          first_status=$?
          set -e
          test -f eula.txt || { cat first-run.log; exit 1; }
          test -f server.properties || { cat first-run.log; exit 1; }
          echo "Initial server process exited with status $first_status; generated files are present."

      - name: Accept EULA and configure generated server.properties
        working-directory: build/server
        env:
          HAS_RESOURCE_PACK: ${{ env.HAS_RESOURCE_PACK }}
          MC_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'eula=true\n' > eula.txt

          set_property() {
            local key="$1"
            local value="$2"
            if grep -q "^${key}=" server.properties; then
              sed -i "s|^${key}=.*|${key}=${value}|" server.properties
            else
              printf '%s=%s\n' "$key" "$value" >> server.properties
            fi
          }

          set_property online-mode "false"
          set_property enable-command-block "true"
          set_property allow-flight "true"
          set_property spawn-protection "0"
          set_property force-gamemode "false"
          set_property white-list "false"
          set_property level-name "world"

          set_property server-ip ""
          set_property server-port "25565"

          if [ "$(printf '%s\n' "$MC_VERSION" "1.19.1" | sort -V | head -n1)" = "1.19.1" ]; then
            set_property enforce-secure-profile "false"
          fi

          if [ "$HAS_RESOURCE_PACK" = "true" ]; then
            pack_sha1="$(sha1sum resource-pack.zip | awk '{print $1}')"
            set_property resource-pack ""
            set_property resource-pack-sha1 "$pack_sha1"

            if [ "$(printf '%s\n' "$MC_VERSION" "1.17" | sort -V | head -n1)" = "1.17" ]; then
              set_property require-resource-pack "false"
              set_property resource-pack-prompt '{"text":"This server has a custom resource pack."}'
            fi
          else
            set_property resource-pack ""
            set_property resource-pack-sha1 ""

            if [ "$(printf '%s\n' "$MC_VERSION" "1.17" | sort -V | head -n1)" = "1.17" ]; then
              set_property require-resource-pack "false"
              set_property resource-pack-prompt ""
            fi
          fi

          if [ -f "$GITHUB_WORKSPACE/config/server.properties" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|'#'*|';'*) continue ;;
              esac
              if [[ "$line" != *=* ]]; then
                echo "::error::Invalid line in config/server.properties: $line"
                exit 1
              fi
              key="${line%%=*}"
              value="${line#*=}"
              set_property "$key" "$value"
            done < "$GITHUB_WORKSPACE/config/server.properties"
          fi

      - name: Verify server reaches Done
        working-directory: build/server
        env:
          HAS_RESOURCE_PACK: ${{ env.HAS_RESOURCE_PACK }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$HAS_RESOURCE_PACK" = "true" ]; then
            sed -i 's|^resource-pack=.*|resource-pack=|' server.properties
            if grep -q '^require-resource-pack=' server.properties; then
              sed -i 's|^require-resource-pack=.*|require-resource-pack=false|' server.properties
            fi
          fi

          rm -f verify.log console.pipe
          mkfifo console.pipe

          java -Xms1G -Xmx4G -jar server.jar nogui <console.pipe >verify.log 2>&1 &
          server_pid=$!
          exec 3>console.pipe

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              printf 'stop\n' >&3 || true
              sleep 5 || true
              kill -TERM "$server_pid" 2>/dev/null || true
            fi
            exec 3>&- || true
            rm -f console.pipe
          }
          trap cleanup EXIT

          for _ in $(seq 1 180); do
            if grep -q 'Done (' verify.log; then
              echo "Minecraft reached Done."
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Minecraft exited before reaching Done."
              cat verify.log
              exit 1
            fi
            sleep 1
            if [ "$_" -eq 180 ]; then
              echo "::error::Minecraft did not reach Done within 180 seconds."
              cat verify.log
              exit 1
            fi
          done

          sleep 5

      - name: Prepare final resource-pack hosting directory
        if: env.HAS_RESOURCE_PACK == 'true'
        working-directory: build/server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resource-pack-host
          mv resource-pack.zip resource-pack-host/resource-pack.zip
          sed -i 's|^resource-pack=.*|resource-pack=|' server.properties
          test -f resource-pack-host/resource-pack.zip

      - name: Generate Linux VPS start.sh
        working-directory: build/server
        env:
          MC_VERSION: ${{ inputs.version }}
          JAVA_VERSION: ${{ env.JAVA_VERSION }}
          HAS_RESOURCE_PACK: ${{ env.HAS_RESOURCE_PACK }}
        shell: bash
        run: |
          set -euo pipefail

          cat > start.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          BASE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$BASE_DIR"

          SERVER_JAR="server.jar"
          MC_VERSION="__MC_VERSION__"
          REQUIRED_JAVA_MAJOR="__JAVA_VERSION__"
          HAS_RESOURCE_PACK="__HAS_RESOURCE_PACK__"
          RESOURCE_PACK_PORT=8080
          JAVA_DIR="$BASE_DIR/.java/temurin-$REQUIRED_JAVA_MAJOR"
          JAVA_BIN="$JAVA_DIR/bin/java"
          PID_FILE="$BASE_DIR/.minecraft-server.pid"

          as_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            elif command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              echo "ERROR: sudo is unavailable."
              exit 1
            fi
          }

          install_dependencies() {
            local need_python="$1"

            if command -v curl >/dev/null 2>&1 &&
               command -v tar >/dev/null 2>&1 &&
               command -v gzip >/dev/null 2>&1 &&
               command -v zip >/dev/null 2>&1 &&
               command -v unzip >/dev/null 2>&1 &&
               [ -f /etc/ssl/certs/ca-certificates.crt ]; then
              if [ "$need_python" = "false" ] || command -v python3 >/dev/null 2>&1; then
                return 0
              fi
            fi

            if command -v apt-get >/dev/null 2>&1; then
              as_root apt-get update
              as_root apt-get install -y curl zip unzip ca-certificates tar gzip
              [ "$need_python" = "true" ] && as_root apt-get install -y python3
            elif command -v dnf >/dev/null 2>&1; then
              as_root dnf install -y curl zip unzip ca-certificates tar gzip
              [ "$need_python" = "true" ] && as_root dnf install -y python3
            elif command -v yum >/dev/null 2>&1; then
              as_root yum install -y curl zip unzip ca-certificates tar gzip
              [ "$need_python" = "true" ] && as_root yum install -y python3
            elif command -v zypper >/dev/null 2>&1; then
              as_root zypper --non-interactive install curl zip unzip ca-certificates tar gzip
              [ "$need_python" = "true" ] && as_root zypper --non-interactive install python3
            elif command -v apk >/dev/null 2>&1; then
              as_root apk add curl zip unzip ca-certificates tar gzip
              [ "$need_python" = "true" ] && as_root apk add python3
            else
              echo "WARNING: Unsupported Linux package manager. Skipping dependency installation."
            fi
          }

          java_major() {
            raw="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
            case "$raw" in
              1.8*) echo 8 ;;
              *) echo "${raw%%.*}" ;;
            esac
          }

          install_java() {
            if [ -x "$JAVA_BIN" ]; then
              if [ "$(JAVA_HOME="$JAVA_DIR" "$JAVA_BIN" -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')" != "" ]; then
                export JAVA_HOME="$JAVA_DIR"
                export PATH="$JAVA_HOME/bin:$PATH"
                installed="$(java_major)"
                if [ "$installed" = "$REQUIRED_JAVA_MAJOR" ]; then
                  return
                fi
              fi
            fi

            install_dependencies false
            mkdir -p "$BASE_DIR/.java"
            rm -rf "$JAVA_DIR"
            mkdir -p "$JAVA_DIR"

            archive="$(mktemp "$BASE_DIR/.java/temurin.XXXXXX.tar.gz")"
            api_jre="https://api.adoptium.net/v3/binary/latest/${REQUIRED_JAVA_MAJOR}/ga/linux/x64/jre/hotspot/normal/eclipse"
            api_jdk="https://api.adoptium.net/v3/binary/latest/${REQUIRED_JAVA_MAJOR}/ga/linux/x64/jdk/hotspot/normal/eclipse"
            mirror_fallback="https://github.com/adoptium/temurin${REQUIRED_JAVA_MAJOR}-binaries/releases/latest/download/OpenJDK${REQUIRED_JAVA_MAJOR}U-jre_x64_linux_hotspot.tar.gz"

            curl --fail --location --retry 5 --retry-delay 2 -o "$archive" "$api_jre" || \
            curl --fail --location --retry 5 --retry-delay 2 -o "$archive" "$api_jdk" || \
            curl --fail --location --retry 5 --retry-delay 2 -o "$archive" "$mirror_fallback"

            tar -xzf "$archive" -C "$JAVA_DIR" --strip-components=1
            rm -f "$archive"

            export JAVA_HOME="$JAVA_DIR"
            export PATH="$JAVA_HOME/bin:$PATH"

            installed="$(java_major)"
            if [ "$installed" != "$REQUIRED_JAVA_MAJOR" ]; then
              echo "ERROR: Java $installed installed; Java $REQUIRED_JAVA_MAJOR required."
              exit 1
            fi
          }

          if [ -f "$PID_FILE" ]; then
            existing_pid="$(cat "$PID_FILE" 2>/dev/null || true)"
            if [[ "$existing_pid" =~ ^[0-9]+$ ]] && kill -0 "$existing_pid" 2>/dev/null; then
              echo "Minecraft server is already running with PID $existing_pid."
              echo "Stop it before starting another instance."
              exit 1
            fi
            rm -f "$PID_FILE"
          fi

          install_java

          echo "Minecraft version: $MC_VERSION"
          echo "Java: $REQUIRED_JAVA_MAJOR"
          echo

          read -r -p "Minimum RAM (GB, whole number): " MIN_RAM_GB
          read -r -p "Maximum RAM (GB, whole number): " MAX_RAM_GB
          read -r -p "OP username (leave empty for none): " OP_USERNAME

          [[ "$MIN_RAM_GB" =~ ^[1-9][0-9]*$ ]] || {
            echo "Minimum RAM must be a positive whole number."
            exit 1
          }

          [[ "$MAX_RAM_GB" =~ ^[1-9][0-9]*$ ]] || {
            echo "Maximum RAM must be a positive whole number."
            exit 1
          }

          [ "$MIN_RAM_GB" -le "$MAX_RAM_GB" ] || {
            echo "Minimum RAM cannot exceed maximum RAM."
            exit 1
          }

          if [ -n "$OP_USERNAME" ]; then
            hex=$(printf "OfflinePlayer:%s" "$OP_USERNAME" | md5sum | cut -d' ' -f1)
            time_low=${hex:0:8}
            time_mid=${hex:8:4}
            time_hi_and_version=${hex:12:4}
            thv=$(printf "%04x" $(( 16#$time_hi_and_version & 16#0FFF | 16#3000 )))
            clock_seq_hi_and_reserved=${hex:16:4}
            csr=$(printf "%04x" $(( 16#$clock_seq_hi_and_reserved & 16#3FFF | 16#8000 )))
            node=${hex:20:12}
            offline_uuid="${time_low}-${time_mid}-${thv}-${csr}-${node}"

            cat > ops.json <<EOF
          [
            {
              "uuid": "$offline_uuid",
              "name": "$OP_USERNAME",
              "level": 4,
              "bypassesPlayerLimit": false
            }
          ]
          EOF
            echo "Generated offline UUID for operator $OP_USERNAME."
          fi

          resource_pid=""
          server_pid=""

          cleanup() {
            if [ -n "$server_pid" ]; then
              if kill -0 "$server_pid" 2>/dev/null; then
                kill -TERM "$server_pid" 2>/dev/null || true
              fi
            fi

            rm -f "$PID_FILE"

            if [ -n "$resource_pid" ] && kill -0 "$resource_pid" 2>/dev/null; then
              kill "$resource_pid" 2>/dev/null || true
              wait "$resource_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          if [ "$HAS_RESOURCE_PACK" = "true" ]; then
            install_dependencies true
            test -f "$BASE_DIR/resource-pack-host/resource-pack.zip"

            python3 -m http.server "$RESOURCE_PACK_PORT" \
              --bind 0.0.0.0 \
              --directory "$BASE_DIR/resource-pack-host" \
              >/tmp/minecraft-resource-pack-http.log 2>&1 &
            resource_pid=$!

            sleep 1

            kill -0 "$resource_pid" 2>/dev/null || {
              cat /tmp/minecraft-resource-pack-http.log || true
              exit 1
            }

            public_ip="$(curl -4 --fail --silent --show-error --max-time 10 https://api.ipify.org)"
            pack_url="http://${public_ip}:${RESOURCE_PACK_PORT}/resource-pack.zip"

            if grep -q '^resource-pack=' server.properties; then
              sed -i "s|^resource-pack=.*|resource-pack=${pack_url}|" server.properties
            else
              printf 'resource-pack=%s\n' "$pack_url" >> server.properties
            fi

            echo "Resource pack URL: $pack_url"
            echo "Make TCP port 8080 reachable from the Internet for the players."
          else
            if grep -q '^resource-pack=' server.properties; then
              sed -i 's|^resource-pack=.*|resource-pack=|' server.properties
            fi
          fi

          "$JAVA_BIN" \
            -Xms"${MIN_RAM_GB}G" \
            -Xmx"${MAX_RAM_GB}G" \
            -jar "$SERVER_JAR" \
            nogui &

          server_pid=$!
          printf '%s\n' "$server_pid" > "$PID_FILE"

          wait "$server_pid"
          server_status=$?

          rm -f "$PID_FILE"

          exit "$server_status"
          SCRIPT

          sed -i "s|__MC_VERSION__|$MC_VERSION|g" start.sh
          sed -i "s|__JAVA_VERSION__|$JAVA_VERSION|g" start.sh
          sed -i "s|__HAS_RESOURCE_PACK__|$HAS_RESOURCE_PACK|g" start.sh
          chmod +x start.sh

      - name: Generate Linux VPS backup.sh
        working-directory: build/server
        env:
          SERVER_NAME: ${{ inputs.name }}
          MC_VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MCB_SECRET: ${{ secrets.MCB }}
        shell: bash
        run: |
          set -euo pipefail

          SAFE_NAME="$(printf '%s' "$SERVER_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\+/-/g; s/^-//; s/-$//')"
          [ -n "$SAFE_NAME" ] || SAFE_NAME=minecraft-server

          RELEASE_TAG="${SAFE_NAME}-${MC_VERSION}"

          cat > backup.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          BASE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$BASE_DIR"

          SERVER_NAME="__SERVER_NAME__"
          SAFE_NAME="__SAFE_NAME__"
          MC_VERSION="__MC_VERSION__"
          GITHUB_REPOSITORY="__GITHUB_REPOSITORY__"
          RELEASE_TAG="__RELEASE_TAG__"

          PID_FILE="$BASE_DIR/.minecraft-server.pid"
          MAX_BYTES=$((2 * 1024 * 1024 * 1024))

          as_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            elif command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              echo "ERROR: sudo is unavailable."
              exit 1
            fi
          }

          install_dependencies() {
            local need_python="$1"

            if command -v curl >/dev/null 2>&1 &&
               command -v tar >/dev/null 2>&1 &&
               command -v gzip >/dev/null 2>&1 &&
               command -v zip >/dev/null 2>&1 &&
               command -v unzip >/dev/null 2>&1 &&
               [ -f /etc/ssl/certs/ca-certificates.crt ]; then
              if [ "$need_python" = "false" ] || command -v python3 >/dev/null 2>&1; then
                return 0
              fi
            fi

            if command -v apt-get >/dev/null 2>&1; then
              as_root apt-get update
              as_root apt-get install -y curl zip unzip ca-certificates tar gzip
              [ "$need_python" = "true" ] && as_root apt-get install -y python3
            elif command -v dnf >/dev/null 2>&1; then
              as_root dnf install -y curl zip unzip ca-certificates tar gzip
              [ "$need_python" = "true" ] && as_root dnf install -y python3
            elif command -v yum >/dev/null 2>&1; then
              as_root yum install -y curl zip unzip ca-certificates tar gzip
              [ "$need_python" = "true" ] && as_root yum install -y python3
            elif command -v zypper >/dev/null 2>&1; then
              as_root zypper --non-interactive install curl zip unzip ca-certificates tar gzip
              [ "$need_python" = "true" ] && as_root zypper --non-interactive install python3
            elif command -v apk >/dev/null 2>&1; then
              as_root apk add curl zip unzip ca-certificates tar gzip
              [ "$need_python" = "true" ] && as_root apk add python3
            else
              echo "WARNING: Unsupported Linux package manager. Skipping dependency installation."
            fi
          }

          find_running_server_pid() {
            if [ -f "$PID_FILE" ]; then
              local pid
              pid="$(cat "$PID_FILE" 2>/dev/null || true)"
              if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then
                printf '%s\n' "$pid"
                return 0
              fi
            fi

            return 1
          }

          stop_minecraft_cleanly() {
            local pid="$1"

            echo "Minecraft is running with PID $pid."
            echo "The server must be stopped cleanly before creating the backup."
            echo

            read -r -p "Stop Minecraft and create the backup? [y/N]: " answer

            case "$answer" in
              y|Y|yes|YES)
                ;;
              *)
                echo "Backup cancelled."
                exit 0
                ;;
            esac

            echo "Requesting graceful Minecraft shutdown..."

            kill -TERM "$pid"

            for _ in $(seq 1 120); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "Minecraft has stopped cleanly."
                rm -f "$PID_FILE"
                return
              fi
              sleep 1
            done

            echo "::error::Minecraft did not stop within 120 seconds."
            echo "The backup was not created."
            exit 1
          }

          get_github_pat() {
            GITHUB_PAT="__MCB_SECRET__"
          }

          get_release_id() {
            local release_json
            local release_id

            release_json="$(
              curl \
                --fail \
                --show-error \
                --silent \
                --location \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_PAT" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
            )"

            release_id="$(
              printf '%s' "$release_json" |
                python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])'
            )"

            [[ "$release_id" =~ ^[0-9]+$ ]] || {
              echo "ERROR: Could not determine the GitHub Release ID."
              exit 1
            }

            printf '%s\n' "$release_id"
          }

          install_dependencies true

          running_pid=""
          if running_pid="$(find_running_server_pid)"; then
            stop_minecraft_cleanly "$running_pid"
          else
            rm -f "$PID_FILE"
          fi

          test -f "$BASE_DIR/server.jar"
          test -f "$BASE_DIR/server.properties"
          test -f "$BASE_DIR/eula.txt"
          test -f "$BASE_DIR/world/level.dat"
          test -x "$BASE_DIR/start.sh"

          get_github_pat

          RELEASE_ID="$(get_release_id)"

          TIMESTAMP="$(date -u '+%Y%m%d-%H%M%S')"
          ARCHIVE_NAME="${SAFE_NAME}-progress-${TIMESTAMP}.zip"
          TEMP_ROOT="$(mktemp -d)"
          STAGE_DIR="$TEMP_ROOT/server"
          ARCHIVE_PATH="$TEMP_ROOT/$ARCHIVE_NAME"

          cleanup() {
            rm -rf "$TEMP_ROOT"
          }
          trap cleanup EXIT

          mkdir -p "$STAGE_DIR"

          echo "Creating a clean backup staging copy..."
          cp -a "$BASE_DIR/." "$STAGE_DIR/"

          # Transient files generated during deployment/runtime.
          rm -rf \
            "$STAGE_DIR/.java" \
            "$STAGE_DIR/logs" \
            "$STAGE_DIR/crash-reports" \
            "$STAGE_DIR/.backup-work"

          rm -f \
            "$STAGE_DIR/.minecraft-server.pid" \
            "$STAGE_DIR/console.pipe" \
            "$STAGE_DIR/first-run.log" \
            "$STAGE_DIR/verify.log"

          # Do not preserve the backup archive itself if one somehow exists.
          find "$STAGE_DIR" -maxdepth 1 -type f -name '*-progress-*.zip' -delete

          # The resource-pack URL is VPS-specific. start.sh will rebuild it
          # using the new VPS public IP when this server is deployed again.
          if [ -f "$STAGE_DIR/server.properties" ]; then
            sed -i 's|^resource-pack=.*|resource-pack=|' "$STAGE_DIR/server.properties"
          fi

          # The PID file and runtime Java installation are not part of the
          # persistent server state.
          rm -f "$STAGE_DIR/.minecraft-server.pid"
          rm -rf "$STAGE_DIR/.java"

          echo "Compressing server directory..."
          (
            cd "$STAGE_DIR"
            zip -qr -6 "$ARCHIVE_PATH" .
          )

          test -s "$ARCHIVE_PATH"

          size_bytes="$(stat -c '%s' "$ARCHIVE_PATH")"
          if [ "$size_bytes" -ge "$MAX_BYTES" ]; then
            echo "::error::Progress backup is not below the 2 GiB GitHub Release asset limit."
            exit 1
          fi

          echo
          echo "Backup created: $ARCHIVE_NAME"
          ls -lh "$ARCHIVE_PATH"
          echo "Uploading to GitHub Release:"
          echo "  Repository: $GITHUB_REPOSITORY"
          echo "  Release tag: $RELEASE_TAG"
          echo

          UPLOAD_URL="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_PAT" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ARCHIVE_PATH" \
            "${UPLOAD_URL}?name=${ARCHIVE_NAME}"

          echo
          echo "Progress backup uploaded successfully."
          echo "Asset: ${ARCHIVE_NAME}"
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          SCRIPT

          sed -i "s|__SERVER_NAME__|$(printf '%s' "$SERVER_NAME" | sed 's/[&|]/\\&/g')|g" backup.sh
          sed -i "s|__SAFE_NAME__|$SAFE_NAME|g" backup.sh
          sed -i "s|__MC_VERSION__|$MC_VERSION|g" backup.sh
          sed -i "s|__GITHUB_REPOSITORY__|$GITHUB_REPOSITORY|g" backup.sh
          sed -i "s|__RELEASE_TAG__|$RELEASE_TAG|g" backup.sh
          sed -i "s|__MCB_SECRET__|$MCB_SECRET|g" backup.sh

          chmod +x backup.sh

      - name: Clean and validate final server
        working-directory: build/server
        shell: bash
        run: |
          set -euo pipefail
          rm -f first-run.log verify.log console.pipe .minecraft-server.pid
          rm -rf logs crash-reports .java
          test -s server.jar
          test -f world/level.dat
          test -f eula.txt
          test -f server.properties
          test -x start.sh
          test -x backup.sh
          if [ "${{ env.HAS_RESOURCE_PACK }}" = "true" ]; then
            test -s resource-pack-host/resource-pack.zip
          fi

      - name: Package server ZIP
        env:
          SERVER_NAME: ${{ inputs.name }}
          MC_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          SAFE_NAME="$(printf '%s' "$SERVER_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\+/-/g; s/^-//; s/-$//')"
          [ -n "$SAFE_NAME" ] || SAFE_NAME=minecraft-server

          RELEASE_TAG="${SAFE_NAME}-${MC_VERSION}"
          ZIP_NAME="${SAFE_NAME}-${{ github.run_id }}-${{ github.run_attempt }}.zip"

          rm -rf build/package
          mkdir -p "build/package/$SAFE_NAME"
          cp -a build/server/. "build/package/$SAFE_NAME/"

          cd build/package
          zip -qr -6 "../../$ZIP_NAME" "$SAFE_NAME"
          cd ../..

          size_bytes="$(stat -c '%s' "$ZIP_NAME")"
          max_bytes=$((2 * 1024 * 1024 * 1024))

          if [ "$size_bytes" -ge "$max_bytes" ]; then
            echo "::error::Server ZIP is not below the 2 GiB GitHub Release asset limit."
            exit 1
          fi

          echo "SAFE_NAME=$SAFE_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          ls -lh "$ZIP_NAME"

      - name: Publish GitHub Release and upload ZIP
        id: release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ inputs.name }} — Minecraft ${{ inputs.version }}
          body: |
            ${{ inputs.description }}

            ## Server download

            The exact VPS commands are added automatically after the ZIP is uploaded.

            ## Progress backups

            Run `./backup.sh` from the extracted server directory to create a timestamped progress backup and upload it as a separate Release asset.
          files: ${{ env.ZIP_NAME }}
          overwrite_files: false

      - name: Get exact release asset URL
        env:
          ASSETS_JSON: ${{ steps.release.outputs.assets }}
        shell: bash
        run: |
          set -euo pipefail

          ASSET_URL="$(
            printf '%s' "$ASSETS_JSON" |
              jq -r --arg n "$ZIP_NAME" '.[] | select(.name == $n) | .browser_download_url' |
              head -n1
          )"

          [ -n "$ASSET_URL" ] &&
          [ "$ASSET_URL" != "null" ] || {
            echo "::error::Could not determine release asset browser_download_url."
            exit 1
          }

          echo "ASSET_URL=$ASSET_URL" >> "$GITHUB_ENV"

      - name: Write exact VPS instructions into release description
        env:
          GH_TOKEN: ${{ github.token }}
          USER_DESCRIPTION: ${{ inputs.description }}
          SERVER_NAME: ${{ inputs.name }}
          MC_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG}"

          {
            printf '%s\n\n' "$USER_DESCRIPTION"

            echo "## Server information"
            echo
            echo "- **Name:** $SERVER_NAME"
            echo "- **Minecraft version:** $MC_VERSION"
            echo "- **Java:** Java $JAVA_VERSION"

            if [ "${{ env.HAS_RESOURCE_PACK }}" = "true" ]; then
              echo "- **Resource pack:** Included; start.sh serves it locally on TCP 8080"
              if [ "$(printf '%s\n' "$MC_VERSION" "1.17" | sort -V | head -n1)" = "1.17" ]; then
                echo "- **Resource-pack behavior:** Required on Minecraft 1.17+"
              else
                echo "- **Resource-pack behavior:** Optional prompt on versions before 1.17; the client/server resource-pack setting must permit prompts"
              fi
            else
              echo "- **Resource pack:** None"
            fi

            echo "- **Map-friendly defaults:** command blocks enabled, flight allowed, spawn protection disabled, online authentication disabled"
            echo
            echo "## Exact commands for a fresh Linux VPS"
            echo
            echo "### 1. Download the prepared server"
            echo
            echo "#### Method 1 (GitHub official)"
            echo '```bash'
            printf "curl -fL '%s' -o '%s'\n" "$ASSET_URL" "$ZIP_NAME"
            echo '```'
            echo
            echo "#### Method 2 (Proxy route)"
            echo '```bash'
            printf "curl -fL '[https://ghproxy.com/%s](https://ghproxy.com/%s)' -o '%s'\n" "$ASSET_URL" "$ZIP_NAME"
            echo '```'
            echo
            echo "#### Method 3 (Alternative mirror)"
            echo '```bash'
            printf "curl -fL '[https://mirror.ghproxy.com/%s](https://mirror.ghproxy.com/%s)' -o '%s'\n" "$ASSET_URL" "$ZIP_NAME"
            echo '```'
            echo
            echo "#### Automatic fallback (Try all routes)"
            echo '```bash'
            printf "curl -fL '%s' -o '%s' || \\\\\n" "$ASSET_URL" "$ZIP_NAME"
            printf "curl -fL '[https://ghproxy.com/%s](https://ghproxy.com/%s)' -o '%s' || \\\\\n" "$ASSET_URL" "$ZIP_NAME"
            printf "curl -fL '[https://mirror.ghproxy.com/%s](https://mirror.ghproxy.com/%s)' -o '%s'\n" "$ASSET_URL" "$ZIP_NAME"
            echo '```'
            echo
            echo "### 2. Install the lightweight ZIP extractor"
            echo '```bash'
            echo 'sudo apt-get update && sudo apt-get install -y unzip'
            echo '```'
            echo
            echo "### 3. Extract the server"
            echo '```bash'
            printf "unzip '%s'\n" "$ZIP_NAME"
            echo '```'
            echo
            echo "### 4. Navigate to the extracted server directory"
            echo '```bash'
            printf "cd '%s'\n" "$SAFE_NAME"
            echo '```'
            echo
            echo "### 5. Ensure the scripts are executable"
            echo '```bash'
            echo 'chmod +x start.sh backup.sh'
            echo '```'
            echo
            echo "### 6. Start the server"
            echo '```bash'
            echo './start.sh'
            echo '```'
            echo
            echo "The start script installs/downloads the exact required Java major version and then asks for RAM requirements and an OP username."
            echo
            echo "## Save your progress"
            echo
            echo "When you want to create a persistent progress backup, stop or save your work and run:"
            echo '```bash'
            echo './backup.sh'
            echo '```'
            echo
            echo "If Minecraft is still running, backup.sh will ask permission to stop it cleanly before creating the backup."
            echo "The resulting timestamped ZIP is uploaded as a separate asset to this same GitHub Release."
            echo "backup.sh does not preserve the runtime Java installation, logs, PID file, temporary verification files, or the previous VPS-specific resource-pack URL."
            
            if [ "${{ env.HAS_RESOURCE_PACK }}" = "true" ]; then
              echo
              echo "### Resource-pack networking"
              echo
              echo "The script serves the included resource-pack ZIP from the VPS on TCP port 8080. That port must be reachable by the players' Minecraft clients; also allow it in the VPS/provider firewall if needed."
            fi
          } > release-notes.md

          gh release edit "$TAG" --notes-file release-notes.md

      - name: Print final release URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json url,name --jq '"Release: \(.name)\nURL: \(.url)"'
