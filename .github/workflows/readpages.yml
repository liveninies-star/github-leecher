name: Crawl & Leech Web Pages (PDF Output - Fixed)

on:
  workflow_dispatch:
    inputs:
      start_url:
        description: 'Starting URL to crawl'
        required: true
        default: 'https://example.com/projects'
      max_depth:
        description: 'Maximum crawl depth (0 = only start URL)'
        required: true
        default: '2'
      max_pages:
        description: 'Maximum total pages to download'
        required: true
        default: '50'
      link_pattern:
        description: 'Regex pattern for links to follow (e.g., /project/.*)'
        required: false
        default: ''
      same_domain_only:
        description: 'Only follow links on same domain? (true/false)'
        required: false
        default: 'true'

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 urllib3 playwright
          playwright install chromium
          sudo apt-get update
          sudo apt-get install -y libgbm1 libasound2

      - name: Run crawler with PDF generation
        env:
          START_URL: ${{ github.event.inputs.start_url }}
          MAX_DEPTH: ${{ github.event.inputs.max_depth }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          LINK_PATTERN: ${{ github.event.inputs.link_pattern }}
          SAME_DOMAIN_ONLY: ${{ github.event.inputs.same_domain_only }}
        run: |
          python - << 'EOF'
          import os, re, time, hashlib
          import requests
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup
          from collections import deque
          from playwright.sync_api import sync_playwright
          
          start_url = os.environ['START_URL']
          max_depth = int(os.environ['MAX_DEPTH'])
          max_pages = int(os.environ['MAX_PAGES'])
          link_pattern = os.environ.get('LINK_PATTERN', '')
          same_domain_only = os.environ.get('SAME_DOMAIN_ONLY', 'true').lower() == 'true'
          
          # Create directories
          pdf_dir = "downloaded_pdfs"
          os.makedirs(pdf_dir, exist_ok=True)
          
          visited = set()
          queue = deque([(start_url, 0)])
          downloaded = 0
          start_domain = urlparse(start_url).netloc
          
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
          
          def get_pdf_filename(url):
              parsed = urlparse(url)
              path = parsed.path if parsed.path else "index"
              if path.endswith('/'):
                  path += "index"
              name = f"{parsed.netloc}{path}".replace('/', '_').replace('?', '_').replace('=', '_')
              if len(name) > 200:
                  name = hashlib.md5(url.encode()).hexdigest()
              return f"{pdf_dir}/{name}.pdf"
          
          def should_follow(link):
              if not link:
                  return False
              if same_domain_only:
                  link_domain = urlparse(link).netloc
                  if link_domain != start_domain:
                      return False
              if link_pattern:
                  if not re.search(link_pattern, link):
                      return False
              return True
          
          def extract_links(html, base_url):
              soup = BeautifulSoup(html, 'html.parser')
              links = []
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  absolute_url = urljoin(base_url, href)
                  parsed = urlparse(absolute_url)
                  # Skip common non-page files
                  skip_extensions = ('.jpg', '.jpeg', '.png', '.gif', '.pdf', '.zip', '.mp4', '.mp3', '.css', '.js')
                  if parsed.path.lower().endswith(skip_extensions):
                      continue
                  clean_url = f"{parsed.scheme}://{parsed.netloc}{parsed.path}"
                  links.append(clean_url)
              return links
          
          print(f"Starting crawl: {start_url}")
          print(f"Max depth: {max_depth}, Max pages: {max_pages}")
          
          # Initialize Playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              
              while queue and downloaded < max_pages:
                  url, depth = queue.popleft()
                  
                  if url in visited:
                      continue
                  if depth > max_depth:
                      continue
                  
                  print(f"[{downloaded+1}/{max_pages}] Depth {depth}: {url}")
                  
                  try:
                      # First fetch HTML to extract links (faster)
                      resp = requests.get(url, headers=headers, timeout=30)
                      resp.raise_for_status()
                      content = resp.text
                      
                      # Extract links for crawling
                      if depth < max_depth:
                          new_links = extract_links(content, url)
                          for link in new_links:
                              if link not in visited and should_follow(link):
                                  queue.append((link, depth + 1))
                      
                      # Generate PDF with browser
                      print(f"  Rendering to PDF...")
                      page = browser.new_page()
                      try:
                          page.goto(url, wait_until='networkidle', timeout=30000)
                          page.wait_for_timeout(2000)  # Extra wait for lazy content
                          
                          pdf_filename = get_pdf_filename(url)
                          page.pdf(path=pdf_filename, format='A4', print_background=True)
                          
                          print(f"  ✅ Saved: {os.path.basename(pdf_filename)}")
                          downloaded += 1
                          
                      except Exception as pdf_err:
                          print(f"  ❌ PDF failed: {pdf_err}")
                      finally:
                          page.close()
                      
                      visited.add(url)
                      
                  except Exception as e:
                      print(f"  ❌ Failed to fetch: {e}")
                      continue
                  
                  time.sleep(1)  # Polite delay
              
              browser.close()
          
          # Create summary
          summary = f"""# Crawl Summary (PDF Format)
          
          - Start URL: {start_url}
          - Max depth: {max_depth}
          - Pages converted: {downloaded}
          - Timestamp: {time.strftime('%Y-%m-%d %H:%M:%S')}
          
          ## PDF Files Downloaded
          
          """
          for f in sorted(os.listdir(pdf_dir)):
              if f.endswith('.pdf'):
                  size_kb = os.path.getsize(f"{pdf_dir}/{f}") / 1024
                  summary += f"- {f} ({size_kb:.1f} KB)\n"
          
          with open("crawl_summary.md", "w") as sf:
              sf.write(summary)
          
          print(f"\n✅ Crawl completed. Saved {downloaded} PDFs.")
          EOF

      - name: Commit and push PDF files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded_pdfs/ crawl_summary.md
          git diff --cached --quiet || git commit -m "Add crawled pages as PDF from ${{ github.event.inputs.start_url }}"
          git push
