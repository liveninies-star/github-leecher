name: Crawl & Leech - Full Browser PDF

on:
  workflow_dispatch:
    inputs:
      start_url:
        description: 'Starting URL to crawl'
        required: true
        default: 'https://example.com'
      max_depth:
        description: 'Maximum crawl depth (0 = only start URL)'
        required: true
        default: '1'
      max_pages:
        description: 'Maximum total pages to convert to PDF'
        required: true
        default: '30'
      link_pattern:
        description: 'Regex pattern for links to follow (e.g., /docs/.*)'
        required: false
        default: ''
      same_domain_only:
        description: 'Only follow links on same domain? (true/false)'
        required: false
        default: 'true'

jobs:
  crawl-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright browsers with all dependencies (CRITICAL)
        uses: microsoft/playwright-github-action@v1
        # This official action installs Chromium + all system libraries automatically

      - name: Run crawler and generate PDFs
        env:
          START_URL: ${{ github.event.inputs.start_url }}
          MAX_DEPTH: ${{ github.event.inputs.max_depth }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          LINK_PATTERN: ${{ github.event.inputs.link_pattern }}
          SAME_DOMAIN_ONLY: ${{ github.event.inputs.same_domain_only }}
        run: |
          python -u << 'EOF'
          import os, re, time, hashlib
          import requests
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup
          from collections import deque
          from playwright.sync_api import sync_playwright

          start_url = os.environ['START_URL']
          max_depth = int(os.environ['MAX_DEPTH'])
          max_pages = int(os.environ['MAX_PAGES'])
          link_pattern = os.environ.get('LINK_PATTERN', '')
          same_domain_only = os.environ.get('SAME_DOMAIN_ONLY', 'true').lower() == 'true'

          PDF_DIR = "downloaded_pdfs"
          os.makedirs(PDF_DIR, exist_ok=True)

          visited = set()
          queue = deque([(start_url, 0)])
          downloaded = 0
          start_domain = urlparse(start_url).netloc

          def safe_filename(url):
              parsed = urlparse(url)
              path = parsed.path if parsed.path else "index"
              if path.endswith('/'):
                  path += "index"
              name = f"{parsed.netloc}{path}".replace('/', '_').replace('?', '_').replace('=', '_')
              if len(name) > 200:
                  name = hashlib.md5(url.encode()).hexdigest()
              return f"{PDF_DIR}/{name}.pdf"

          def should_follow(link):
              if not link:
                  return False
              if same_domain_only:
                  if urlparse(link).netloc != start_domain:
                      return False
              if link_pattern:
                  if not re.search(link_pattern, link):
                      return False
              return True

          def extract_links(html, base_url):
              soup = BeautifulSoup(html, 'html.parser')
              links = []
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  abs_url = urljoin(base_url, href)
                  # Skip non-html files
                  skip_ext = ('.jpg','.jpeg','.png','.gif','.pdf','.zip','.mp4','.mp3','.css','.js','.ico','.svg')
                  if urlparse(abs_url).path.lower().endswith(skip_ext):
                      continue
                  clean = f"{urlparse(abs_url).scheme}://{urlparse(abs_url).netloc}{urlparse(abs_url).path}"
                  links.append(clean)
              return list(set(links))

          print(f"🚀 Starting crawl: {start_url}")
          print(f"📏 Max depth: {max_depth}, 🧾 Max pages: {max_pages}")

          with sync_playwright() as p:
              # Launch browser once for all pages (saves time)
              browser = p.chromium.launch(headless=True)
              
              while queue and downloaded < max_pages:
                  url, depth = queue.popleft()
                  if url in visited or depth > max_depth:
                      continue

                  print(f"\n[{downloaded+1}/{max_pages}] Depth {depth}: {url}")

                  # ---- Step 1: Download HTML to extract links (fast) ----
                  try:
                      resp = requests.get(url, headers={'User-Agent': 'Mozilla/5.0'}, timeout=30)
                      resp.raise_for_status()
                      html = resp.text
                  except Exception as e:
                      print(f"  ⚠️ Failed to fetch HTML: {e}")
                      continue

                  # Extract new links
                  if depth < max_depth:
                      new_links = extract_links(html, url)
                      for link in new_links:
                          if link not in visited and should_follow(link):
                              queue.append((link, depth+1))

                  # ---- Step 2: Render page in real browser and save PDF ----
                  pdf_path = safe_filename(url)
                  page = browser.new_page()
                  try:
                      print(f"  🎨 Rendering with Chromium...")
                      page.goto(url, wait_until='networkidle', timeout=45000)
                      page.wait_for_timeout(2000)  # extra for lazy content
                      page.pdf(path=pdf_path, format='A4', print_background=True)
                      print(f"  ✅ PDF saved: {os.path.basename(pdf_path)}")
                      downloaded += 1
                  except Exception as e:
                      print(f"  ❌ PDF generation error: {e}")
                  finally:
                      page.close()

                  visited.add(url)
                  time.sleep(1)  # politeness

              browser.close()

          # Create summary
          summary = f"""# Crawl Summary – Full Browser PDF

          - **Start URL**: {start_url}
          - **Max depth**: {max_depth}
          - **Pages converted**: {downloaded}
          - **Date**: {time.strftime('%Y-%m-%d %H:%M:%S')}

          ## PDF files

          """
          for f in sorted(os.listdir(PDF_DIR)):
              if f.endswith('.pdf'):
                  size = os.path.getsize(f"{PDF_DIR}/{f}") / 1024
                  summary += f"- {f} ({size:.1f} KB)\n"

          with open("crawl_summary.md", "w") as sf:
              sf.write(summary)

          print(f"\n✅ Done. Saved {downloaded} PDFs to '{PDF_DIR}'")
          EOF

      - name: Commit and push PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded_pdfs/ crawl_summary.md
          git diff --cached --quiet || git commit -m "PDF crawl of ${{ github.event.inputs.start_url }}"
          git push
